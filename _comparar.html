<!doctype html><html><head><meta charset="utf-8"><title>Comparar</title>
<style>html,body{margin:0;height:100%;background:#000;overflow:hidden}#gl{position:fixed;inset:0;width:100vw;height:100vh}
#v{position:fixed;left:0;top:0;width:100vw;height:55.8vw}#ov{position:fixed;left:0;top:0;width:100vw;height:55.8vw;opacity:0;pointer-events:none}
#labels{position:fixed;inset:0;pointer-events:none}</style></head><body>
<canvas id="gl"></canvas><div id="v"></div><img id="ov" src="assets/render_madre.jpg"><div id="labels"></div>
<script src="vendor/three.min.js"></script><script src="assets/logo_data.js"></script><script src="stand3d.js?v=62"></script><script src="_diff.js?v=2"></script>
<script>
const S=Stand3D.init(document.getElementById('gl'),document.getElementById('labels'));
const V=S.view(document.getElementById('v'),{preset:'render',interactive:true}); V.active=true;
window.cam=(px,py,pz,tx,ty,tz,fov)=>{const P={pos:[px,py,pz],target:[tx,ty,tz],fov};V.o=V.o;Object.assign(V.goal,{});const d=new THREE.Vector3(px-tx,py-ty,pz-tz);const r=d.length();V.goal.r=V.cur.r=r;V.goal.theta=V.cur.theta=Math.atan2(d.x,d.z);V.goal.phi=V.cur.phi=Math.acos(d.y/r);V.goal.t.set(tx,ty,tz);V.cur.t.set(tx,ty,tz);V.fovGoal=fov;V.cam.fov=fov;};
window.ov=o=>document.getElementById('ov').style.opacity=o;
window.loadGLB=async()=>{const b=await (await fetch('../recursos_entrada/04_renders/modelo_ia_tripo.glb')).arrayBuffer();
 const dv=new DataView(b);const l0=dv.getUint32(12,true);const js=JSON.parse(new TextDecoder().decode(new Uint8Array(b,20,l0)));const bin=20+l0+8;
 const acc=i=>{const a=js.accessors[i],bv=js.bufferViews[a.bufferView];const o=bin+(bv.byteOffset||0)+(a.byteOffset||0);const n={SCALAR:1,VEC3:3,VEC2:2}[a.type];
  return a.componentType===5126?new Float32Array(b.slice(o,o+a.count*n*4)):new Uint32Array(b.slice(o,o+a.count*n*4));};
 const p=js.meshes[0].primitives[0];const pos=acc(p.attributes.POSITION),idx=acc(p.indices);const k=3.43/0.92;
 for(let i=0;i<pos.length;i+=3){pos[i]=(pos[i]+0.49)*k;pos[i+1]*=k;pos[i+2]=(pos[i+2]+0.355)*k;}
 const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(pos,3));g.setIndex(new THREE.BufferAttribute(idx,1));g.computeVertexNormals();
 window.glb=new THREE.Mesh(g,new THREE.MeshBasicMaterial({color:0xff2a2a,transparent:true,opacity:0.35,depthWrite:false}));S.scene.add(glb);return 'ok';};
</script></body></html>
